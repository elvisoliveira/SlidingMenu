// Vendored from github.com/jfeinstein10/SlidingMenu @ 4254feca3ece (Apache-2.0, see LICENSE.txt)
plugins {
    id 'com.android.library'
}

android {
    namespace 'com.jeremyfeinstein.slidingmenu.lib'
    compileSdk 19

    defaultConfig {
        minSdk 7
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.android:support-v4:r7'
}
